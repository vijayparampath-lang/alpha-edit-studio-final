<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Alpha Edit Studio" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#080808" />
    
    <!-- PWA & Favicon Assets -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/final-logo.jpg" />
    <link rel="icon" type="image/jpeg" href="/final-logo.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alpha Edit Studio" />

    <!-- Preconnect for Performance SEO -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function() {
        localStorage.setItem('vj-portfolio-theme', 'dark');
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.documentElement.style.colorScheme = 'dark';
      })();
    </script>
    <title>Alpha Edit Studio | Luxury Post-Production & Creative Agency</title>
    <meta name="description" content="Official portfolio of Alpha Edit Studio. Specializing in luxury video editing, high-retention social motion assets, vector brand identity, and cinematic post-production." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alpha Edit Studio | Luxury Post-Production & Creative Agency" />
    <meta property="og:description" content="Discover premium post-production, luxury brand identity, high-retention video edits, and cinematic reels by Alpha Edit Studio." />
    <meta property="og:image" content="/final-logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Alpha Edit Studio | Luxury Post-Production & Creative Agency" />
    <meta property="twitter:description" content="Discover premium post-production, luxury brand identity, high-retention video edits, and cinematic reels by Alpha Edit Studio." />
    <meta property="twitter:image" content="/final-logo.jpg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://alphaeditstudio.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
